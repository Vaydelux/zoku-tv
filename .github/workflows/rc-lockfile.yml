name: Temporary RC Lockfile Refresh
on:
  push:
    branches: [release/rc-browser-validation-2026-11-15]
    paths:
      - package.json
      - .github/workflows/rc-lockfile.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit deterministic RC dependency tree
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build(rc): lock Playwright Core browser tooling"
          git push origin "HEAD:${GITHUB_REF_NAME}"
