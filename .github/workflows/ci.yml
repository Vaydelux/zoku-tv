name: Zoku TV Quality Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Typecheck, Unit Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript & Lint Checks
        run: npm run typecheck

      - name: Run Automated Unit & Security Isolation Tests
        run: npm test

      - name: Build Production Next.js Bundle
        run: npm run build

