name: Zoku TV Quality Gates

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Typecheck, Unit Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frozen dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Run TypeScript & Lint Checks
        run: npm run typecheck

      - name: Run Automated Unit & Security Isolation Tests
        run: npm test

      - name: Build Production Next.js Bundle
        run: npm run build

